name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRecordings-apk
          path: app/build/outputs/apk/release/*.apk

      # Public download link that needs no GitHub login:
      # https://github.com/<owner>/<repo>/releases/latest/download/CallRecordings.apk
      - name: Publish APK to release
        if: github.event_name != 'pull_request'
        run: |
          cp app/build/outputs/apk/release/app-release.apk CallRecordings.apk
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Call Recordings (latest build)" --notes "Install CallRecordings.apk on your phone."
          gh release upload latest CallRecordings.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
